<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Budget</title>
<style>
:root{--bg:#f5f1e8;--card:#fff;--tx:#14161c;--mut:#7b8190;--pri:#1b2f5e;--acc:#f5c518}
@media (prefers-color-scheme:dark){:root{--bg:#121316;--card:#1f2024;--tx:#f1f3f8;--mut:#8e9199;--pri:#f5c518;--acc:#f5c518}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
.w{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 24px);text-align:center}
.c{background:var(--card);border-radius:24px;padding:28px 20px;width:100%;max-width:360px;box-shadow:0 10px 30px rgba(19,38,82,.12)}
h1{font-size:20px;margin:0 0 8px}
p{color:var(--mut);margin:0 0 20px}
button{border:0;border-radius:999px;background:var(--pri);color:#fff;font:600 16px/1 inherit;font-family:inherit;padding:14px 28px;cursor:pointer;transition:transform .12s ease,background .12s ease}
@media (prefers-color-scheme:dark){button{color:#121316}}
button:active{transform:scale(.97);background:#8a8f99}
</style>
</head>
<body>
<div class="w"><div class="c">
<h1>No connection</h1>
<p>Budget can't reach the server. Check the internet and try again.</p>
<button id="r">Try again</button>
</div></div>
<script>
var U = 'https://budget.in-manager.uz/';
document.getElementById('r').onclick = function () { location.href = U; };
window.addEventListener('online', function () { location.href = U; });
</script>
</body>
</html>
