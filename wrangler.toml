name = "expense-tracker"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[ai]
binding = "AI"

[placement]
mode = "smart"

[[d1_databases]]
binding = "DB"
database_name = "expense-tracker"
database_id = "00000000-0000-0000-0000-000000000000"
