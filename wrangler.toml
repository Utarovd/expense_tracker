name = "expense-tracker"
main = "src/worker.js"
compatibility_date = "2025-09-01"
routes = [{ pattern = "budget.in-manager.uz", custom_domain = true }]
workers_dev = true

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[ai]
binding = "AI"

[placement]
mode = "smart"

[[d1_databases]]
binding = "DB"
database_name = "expense-tracker"
database_id = "f979d1b1-1d4d-4fb5-9100-377b0d28d218"
