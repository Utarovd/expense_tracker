name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['native/**', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check syntax
        run: |
          node --check src/worker.js
          node -e "new Function(require('fs').readFileSync('public/app.js','utf8'))"
      - name: D1 restore point (Time Travel bookmark before changes)
        run: npx wrangler d1 time-travel info expense-tracker || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply D1 migrations (structure, once each)
        run: npx wrangler d1 migrations apply expense-tracker --remote
        env:
          CI: true
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: OTA manifest (app downloads new web versions by it)
        run: node scripts/ota-manifest.js
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply D1 data fixes (idempotent)
        run: |
          npx wrangler d1 execute expense-tracker --remote --file=schema.sql
          npx wrangler d1 execute expense-tracker --remote --file=db/after.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
