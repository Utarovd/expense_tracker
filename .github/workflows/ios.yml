name: iOS build

# Push в main с изменениями в native/: только проверка, что приложение собирается.
# Ручной запуск (Run workflow, по команде «сделай сборку»): Budget.ipa в релиз "ios-latest".
on:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json
      - name: Select newest Xcode (Capacitor 8 needs Xcode 26+)
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
          xcodebuild -version | head -1 | awk '{ split($2, v, "."); if (v[1] < 26) { print "Xcode 26+ required"; exit 1 } }'
      - run: npm ci
      - name: OTA manifest of the bundled web version
        run: node ../scripts/ota-manifest.js
      - run: npx cap sync ios
      - name: Build (unsigned; AltStore signs it with your Apple ID)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -40
          test -d build/Build/Products/Release-iphoneos/App.app
      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          # ad-hoc подпись только чтобы вложить entitlements (App Group для виджета); AltStore переподписывает своим ID
          for x in Payload/App.app/PlugIns/*.appex; do codesign -f -s - --entitlements ios/App/BudgetWidget/BudgetWidget.entitlements "$x"; done
          codesign -f -s - --entitlements ios/App/App/App.entitlements Payload/App.app
          codesign -d --entitlements - Payload/App.app | head -20
          ls Payload/App.app/PlugIns
          zip -qry Budget.ipa Payload
          ls -la Budget.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Budget-ipa
          path: native/Budget.ipa
          retention-days: 30
      - name: Publish to release "ios-latest"
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag || true
          sleep 5
          # тег создаём явно на этом коммите: иначе GitHub иногда оставлял релиз без тега и ссылка давала 404
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "${GITHUB_SHA}:refs/tags/ios-latest"
          gh release create ios-latest Budget.ipa --verify-tag --title "Budget iOS (build ${{ github.run_number }})" \
            --notes "Unsigned build for AltStore. Built $(TZ=Asia/Tashkent date '+%d.%m %H:%M') Tashkent." --latest=false

  # Проверка скриншотом: приложение в симуляторе iPhone запускается (экран входа).
  sim-check:
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json
      - run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
      - run: npm ci && node ../scripts/ota-manifest.js && npx cap sync ios
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | tail -60
      - name: Run and screenshot
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print([x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')][-1])")
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark || true
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$UDID" uz.inmanager.budget
          sleep 25
          xcrun simctl io "$UDID" screenshot sim-launch.png
          xcrun simctl ui "$UDID" appearance light || true
          sleep 5
          xcrun simctl io "$UDID" screenshot sim-light.png
          # уменьшенные копии в лог (для проверки без скачивания артефакта)
          for f in sim-launch sim-light; do sips -Z 700 -s format jpeg -s formatOptions 60 $f.png --out $f.jpg >/dev/null; echo "IMG-BEGIN $f"; base64 -b 0 -i $f.jpg; echo; echo "IMG-END $f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: sim-screenshots
          path: native/sim-*.png
          retention-days: 7
